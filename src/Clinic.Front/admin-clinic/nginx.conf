server {
  listen 80;
  server_name localhost;

  # Путь к нашим статическим файлам
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Эта строка - магия для React Router и других SPA
  # Она говорит Nginx: попробуй найти файл по запросу,
  # если не нашел - отдай /index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}